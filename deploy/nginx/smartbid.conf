# /etc/nginx/sites-available/smartbid.conf
# Replace /var/www/smartbid with your clone path. certbot --nginx adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name smartbidsolutions.in www.smartbidsolutions.in;

    root /var/www/smartbid/frontend/dist;
    index index.html;

    # Backend upload limit is 10 MB; leave headroom for multipart overhead
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # live tender sync can take a few minutes
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
